name: Feature request
description: Suggest an improvement for MacStorageAtlas.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for product improvements. Please avoid posting private file paths, screenshots with personal data, or account-specific support details.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I checked existing issues for a similar request.
          required: true
        - label: This request does not include private data or security details.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the current app fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like MacStorageAtlas to support.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
